theme = "onedark"

[editor]
line-number = "absolute"
true-color = true
idle-timeout = 40
auto-completion = true
cursorline = true
color-modes = true

[editor.statusline]
left = ["mode", "spacer", "spinner", "file-name"]
center = ["diagnostics"]
right = ["selections", "position", "file-encoding", "file-line-ending", "file-type", "separator" ,"version-control"]
separator = "│"

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false

[editor.lsp]
display-messages = true
display-inlay-hints = true
